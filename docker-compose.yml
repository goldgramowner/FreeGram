services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freegram
      POSTGRES_USER: freegram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - freegram_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freegram -d freegram"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://freegram:${POSTGRES_PASSWORD}@db:5432/freegram
      BOT_API_SECRET: ${BOT_API_SECRET:?Set BOT_API_SECRET in .env}
      OWNER_API_SECRET: ${OWNER_API_SECRET:?Set OWNER_API_SECRET in .env}
      OWNER_FREEGRAM_ID: ${OWNER_FREEGRAM_ID:-}
      OWNER_FREEGRAM_USERNAME: ${OWNER_FREEGRAM_USERNAME:-}
    ports:
      - "${FREEGRAM_PORT:-8000}:8000"

volumes:
  freegram_db:
